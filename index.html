<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kart Racer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="hidden">
      <div class="hud-top-left">
        <div class="lap">LAP <span id="lap">1</span><span class="dim">/<span id="lap-total">3</span></span></div>
        <div class="time" id="time">0:00.000</div>
        <div class="laps" id="lap-times"></div>
      </div>
      <canvas id="minimap" width="180" height="180"></canvas>
      <div class="hud-bottom-right">
        <div class="speed"><span id="speed">0</span><small>km/h</small></div>
        <div class="drift-meter"><div id="drift-fill"></div></div>
      </div>
      <div id="countdown"></div>
      <div id="toast"></div>
      <div id="now-playing"></div>
    </div>

    <div id="touch" class="hidden">
      <div class="touch-left">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="touch-right">
        <button data-key="drift" class="small">DRIFT</button>
        <button data-key="brake" class="small">BRAKE</button>
        <button data-key="gas" class="gas">GO</button>
      </div>
    </div>

    <div id="menu" class="overlay">
      <div class="panel">
        <h1>Kart <span>Racer</span></h1>
        <p class="sub">Castle Cloverleaf · prototype</p>
        <button id="start-btn" class="big">Start race</button>
        <div class="controls">
          <div><kbd>W</kbd>/<kbd>↑</kbd> Accelerate</div>
          <div><kbd>S</kbd>/<kbd>↓</kbd> Brake / reverse</div>
          <div><kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> Steer</div>
          <div><kbd>Space</kbd>/<kbd>Shift</kbd> Hop &amp; drift</div>
          <div><kbd>R</kbd> Respawn on track</div>
          <div><kbd>M</kbd> Mute · <kbd>N</kbd> Next song</div>
        </div>
        <p class="tip">Hold drift while turning. Sparks go <b class="blue">blue</b>, <b class="orange">orange</b>, then <b class="purple">purple</b>. Let go for a boost!</p>
        <p class="tip">Controllers work too.</p>
      </div>
    </div>

    <div id="results" class="overlay hidden">
      <div class="panel">
        <h1>Finish!</h1>
        <div id="results-body"></div>
        <button id="again-btn" class="big">Race again</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
